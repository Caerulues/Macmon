[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macmon"
version = "0.1.0"
description = "Terminal hardware monitor for macOS Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Caerulues"}]
dependencies = [
    "rich>=13.7.0",
    "psutil>=5.9.8",
]

[project.scripts]
macmon = "macmon.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["macmon*"]
